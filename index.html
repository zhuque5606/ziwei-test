<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>紫微斗数 · 真太阳时精断 beta v1.0</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        :root {
            --bg: #0f0f11; --panel: #1a1c22; --panel2: #21242c; --border: #2d3039;
            --text: #e0e2e8; --text2: #9a9da8; --accent: #c9a063; --glow: rgba(201,160,99,0.25);
            --radius: 16px; --radius-sm: 8px;
        }
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);height:100vh;width:100vw;overflow:hidden;display:flex}
        #map-container{width:50%;min-width:0;height:100vh;position:relative;flex-shrink:0;overflow:hidden}
        #map{position:absolute;top:0;left:0;right:0;bottom:0}
        .coord-tag{position:absolute;bottom:18px;left:50%;transform:translateX(-50%);background:rgba(26,28,34,0.9);border:1px solid var(--border);border-radius:20px;padding:8px 16px;font-size:.85rem;z-index:1000;display:flex;gap:12px;align-items:center;color:var(--text2);pointer-events:none}
        .splitter{width:6px;height:100vh;background:var(--panel2);cursor:col-resize;flex-shrink:0;user-select:none;transition:background .2s;border-left:1px solid var(--border);border-right:1px solid var(--border)}
        .splitter:hover,.splitter.active{background:var(--accent)}
        #sidebar{flex:1;height:100vh;background:var(--panel);display:flex;flex-direction:column;overflow-y:auto;z-index:10;min-width:0}
        .sidebar-header{padding:20px 24px 10px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px}
        .sidebar-header .icon{width:36px;height:36px;background:linear-gradient(135deg,#c9a063,#7b5e3b);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:1.2rem;color:#fff}
        .section{padding:16px 24px;border-bottom:1px solid var(--border)}
        .section-title{font-size:.8rem;text-transform:uppercase;color:var(--accent);margin-bottom:12px;font-weight:600}
        .form-row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
        .form-group{display:flex;flex-direction:column;gap:4px;min-width:75px}
        .form-group label{font-size:.7rem;color:var(--text2);white-space:nowrap}
        .form-group input,.form-group select{padding:8px 10px;border-radius:var(--radius-sm);border:1.5px solid var(--border);background:var(--panel2);color:var(--text);font-size:.85rem;outline:none;font-family:inherit}
        .btn{padding:10px 20px;border-radius:25px;border:1.5px solid var(--border);background:var(--panel2);color:var(--text);cursor:pointer;font-size:.9rem}
        .btn:hover{background:#2a2e3a}
        .btn-accent{background:var(--accent);border-color:var(--accent);color:#0f0f11;font-weight:700}
        .btn-sm{padding:6px 12px;font-size:.8rem}
        .coord-display{display:flex;gap:16px;flex-wrap:wrap;font-size:.85rem;background:var(--panel2);padding:10px 16px;border-radius:var(--radius-sm);margin-top:8px}
        .coord-val{font-family:'SF Mono',monospace;color:var(--accent);font-weight:600}
        .result-panel{flex:1;overflow-y:auto;padding:16px 24px}
        .chart-table{width:100%;border-collapse:collapse;font-size:.75rem;margin:16px 0;background:var(--panel2);border-radius:var(--radius-sm);overflow:hidden}
        .chart-table th{background:#2a2e3a;padding:8px;color:var(--accent);font-weight:600;border:1px solid var(--border)}
        .chart-table td{padding:6px;border:1px solid var(--border);text-align:center;vertical-align:top}
        .star-item{display:inline-block;background:rgba(201,160,99,0.15);padding:2px 6px;border-radius:12px;margin:2px;font-size:.7rem}
        .star-major{color:#e0b877}
        .star-fu{color:#a1b0cc;font-size:.65rem}
        .analysis-box{background:var(--panel2);border-radius:var(--radius-sm);padding:16px;margin-top:12px;font-size:.85rem;line-height:1.7;color:#d0d2d8}
        .analysis-box h4{color:var(--accent);margin:12px 0 8px;font-size:.95rem;border-left:3px solid var(--accent);padding-left:8px}
.palace-detail{background:rgba(201,160,99,0.05);border-left:3px solid #5a5e6a;padding:8px 10px;margin:6px 0;border-radius:4px;font-size:.8rem}
.palace-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:6px}
        .toast{position:fixed;top:20px;left:50%;transform:translateX(-50%) translateY(-120px);z-index:9999;background:var(--panel2);color:var(--text);padding:10px 22px;border-radius:25px;border:1px solid var(--border);transition:transform .3s;pointer-events:none;font-size:.9rem}
        .toast.show{transform:translateX(-50%) translateY(0)}
        .person-list{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
        .person-item{display:flex;align-items:center;gap:6px;background:var(--panel2);padding:6px 14px;border-radius:20px;font-size:.8rem;border:1px solid var(--border);cursor:pointer;transition:all .2s}
        .person-item:hover{border-color:var(--accent)}
        .person-item.active{border-color:var(--accent);background:rgba(201,160,99,0.15)}
        .person-item .pname{color:var(--accent);font-weight:600;white-space:nowrap;max-width:80px;overflow:hidden;text-overflow:ellipsis}
        .person-item .pinfo{color:var(--text2);font-size:.7rem;white-space:nowrap}
        .person-item .pdel{width:20px;height:20px;line-height:18px;text-align:center;border-radius:50%;background:transparent;border:none;color:var(--text2);cursor:pointer;font-size:.8rem;margin-left:2px;padding:0;flex-shrink:0}
        .person-item .pdel:hover{color:#f85149;background:rgba(248,81,73,0.15)}
        .person-item .pedit{width:20px;height:20px;line-height:18px;text-align:center;border-radius:50%;background:transparent;border:none;color:var(--text2);cursor:pointer;font-size:.7rem;padding:0;flex-shrink:0}
        .person-item .pedit:hover{color:var(--accent);background:rgba(201,160,99,0.15)}
        .btn-xs{padding:4px 10px;font-size:.7rem;border-radius:15px}
        .btn-danger{border-color:#f85149;color:#f85149}
        .btn-danger:hover{background:rgba(248,81,73,0.15)}
        .modal-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.6);z-index:9000;display:flex;align-items:center;justify-content:center}
        .modal-box{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:24px;min-width:360px;max-width:90vw;max-height:90vh;overflow-y:auto}
        .modal-box h3{color:var(--accent);margin-bottom:16px;font-size:1rem}
        .modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
        .modal-box .form-group{margin-bottom:8px}
        .palace-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:6px}
        @media(max-width:768px){
            body{flex-direction:column;overflow-y:auto}
            #map-container{width:100%!important;height:35vh!important;flex-shrink:initial}
            #sidebar{flex:none;width:100%!important;height:auto;min-height:65vh}
            #splitter{display:none}
            .sidebar-header{padding:12px 16px 8px}
            .sidebar-header h2{font-size:1rem}
            .sidebar-header .icon{width:28px;height:28px;font-size:1rem}
            .section{padding:12px 16px}
            .section-title{font-size:.75rem}
            .form-group{min-width:60px}
            .form-group input,.form-group select{padding:7px 8px;font-size:.8rem}
            .form-row{gap:6px}
            .btn{padding:8px 14px;font-size:.82rem}
            .btn-sm{padding:5px 10px;font-size:.75rem}
            .btn-xs{padding:4px 8px;font-size:.7rem}
            .coord-display{flex-direction:column;gap:6px;font-size:.78rem}
            .person-item{padding:5px 10px;font-size:.75rem}
            .person-item .pname{max-width:60px;font-size:.75rem}
            .person-item .pinfo{font-size:.65rem}
            .person-list{gap:6px}
            .modal-box{min-width:auto;width:95vw;padding:16px;max-height:80vh}
            .modal-box h3{font-size:.9rem;margin-bottom:12px}
            .chart-table{font-size:.68rem}
            .chart-table th,.chart-table td{padding:4px 3px}
            .result-panel{padding:10px 12px}
            .analysis-box{padding:10px}
            .analysis-box h4{font-size:.85rem}
            .palace-detail{font-size:.72rem;padding:6px 8px}
            .star-item{font-size:.62rem;padding:1px 4px}
            .toast{font-size:.8rem;padding:8px 16px;max-width:90vw;text-align:center}
            .palace-grid{grid-template-columns:1fr;gap:4px}
        }
    </style>
</head>
<body>
<div id="map-container"><div id="map"></div><div class="coord-tag"><span>📍</span><span id="coordText">点击地图选择出生地点</span></div></div>
<div id="splitter" class="splitter"></div>

<div id="sidebar">
    <div class="sidebar-header"><div class="icon">☯</div><h2>紫微斗数 · 真太阳时精断 <span style="font-size:.55rem;color:var(--text2);font-weight:400">beta v1.0 · 朱雀</span></h2></div>
    <div class="section">
        <div class="section-title">👤 基本信息</div>
        <div class="form-row">
            <div class="form-group"><label>姓名</label><input type="text" id="nameInput" value="东方"></div>
            <div class="form-group"><label>性别</label><select id="genderSelect"><option value="male">男</option><option value="female">女</option></select></div>
            <div class="form-group"><label>出生日期</label><input type="date" id="birthDate" value="1990-06-15"></div>
        </div>
        <div class="form-row" style="margin-top:10px">
            <div class="form-group"><label>出生小时</label><select id="hourSelect"></select></div>
            <div class="form-group"><label>分钟</label><select id="minuteSelect"><option value="0">00</option><option value="15">15</option><option value="30">30</option><option value="45">45</option></select></div>
        </div>
        <div class="form-row" style="margin-top:8px">
            <div class="form-group"><label>出生经度</label><input type="number" id="birthLngInput" step="any" value="108.9398"></div>
            <div class="form-group"><label>出生纬度</label><input type="number" id="birthLatInput" step="any" value="34.3416"></div>
            <button class="btn btn-sm" id="btnTargetBirth" style="display:inline-flex">🎯 点选出生地</button>
        </div>
        <div class="form-row" style="margin-top:8px">
            <div class="form-group"><label>当下经度</label><input type="number" id="curLngInput" step="any" value="108.9398"></div>
            <div class="form-group"><label>当下纬度</label><input type="number" id="curLatInput" step="any" value="34.3416"></div>
            <button class="btn btn-sm" id="btnTargetCurrent" style="display:none">🎯 点选当下地</button>
        </div>
        <div class="coord-display">
            <span>🕒 出生真太阳时: <span class="coord-val" id="birthTimeDisplay">--</span></span>
            <span>🕒 当下真太阳时: <span class="coord-val" id="curTimeDisplay">--</span></span>
        </div>
    </div>
    <div class="section">
        <div class="section-title">📅 运势评估时间 (年必选，月日时可选)</div>
        <div class="form-row">
            <div class="form-group"><label>年份*</label><select id="evYearSelect"></select></div>
            <div class="form-group"><label>月份</label><select id="evMonthSelect"><option value="">--</option></select></div>
            <div class="form-group"><label>日</label><select id="evDaySelect"><option value="">--</option></select></div>
            <div class="form-group"><label>时</label><select id="evHourSelect"><option value="">--</option></select></div>
        </div>
        <div style="margin-top:8px;font-size:.75rem;color:var(--text2)">月/日/时未选则按年初粗略估算</div>
        <button class="btn btn-accent" style="margin-top:12px" id="btnAnalyze">🔮 开始排盘分析</button>
    </div>
    <div class="section">
        <div class="section-title">💾 人物资料保存 <span style="font-size:.65rem;color:var(--text2)">· 数据仅存本机</span></div>
        <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">
            <button class="btn btn-sm" id="btnSavePerson">💾 保存</button>
            <button class="btn btn-xs" id="btnExportJson">📤 导出JSON</button>
            <button class="btn btn-xs" id="btnImportJson">📥 导入JSON</button>
            <button class="btn btn-xs btn-danger" id="btnClearData">🗑 清空数据</button>
        </div>
        <div style="font-size:.65rem;color:var(--text2);margin-top:4px">数据仅保存在当前浏览器本地存储，不会上传到任何服务器。建议定期导出备份。</div>
        <div class="person-list" id="personList"></div>
        <input type="file" id="importFileInput" accept=".json" style="display:none">
    </div>
    <div class="result-panel" id="resultPanel"><div style="text-align:center;color:var(--text2);padding:20px">⬆️ 填写信息后点击按钮排盘</div></div>
</div>
<div class="toast" id="toast"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
(()=>{
    // ---------- 地图模块 ----------
    const map = L.map('map', { center: [34.3416, 108.9398], zoom: 5, zoomControl: true });
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { attribution: '&copy; OSM', maxZoom: 19 }).addTo(map);
    setTimeout(() => map.invalidateSize(), 200);

    let birthLat = 34.3416, birthLng = 108.9398;
    let curLat = 34.3416, curLng = 108.9398;
    let currentTarget = 'birth', marker = null;

    const birthLatInp = document.getElementById('birthLatInput');
    const birthLngInp = document.getElementById('birthLngInput');
    const curLatInp = document.getElementById('curLatInput');
    const curLngInp = document.getElementById('curLngInput');
    const coordText = document.getElementById('coordText');
    const btnBirth = document.getElementById('btnTargetBirth');
    const btnCurrent = document.getElementById('btnTargetCurrent');
    const birthTimeDisp = document.getElementById('birthTimeDisplay');
    const curTimeDisp = document.getElementById('curTimeDisplay');

    function setTarget(target){
        currentTarget = target;
        if(target==='birth'){
            btnBirth.style.display='inline-flex'; btnCurrent.style.display='none';
            coordText.textContent='🎯 正在点选：出生地';
        } else {
            btnBirth.style.display='none'; btnCurrent.style.display='inline-flex';
            coordText.textContent='🎯 正在点选：当下地';
        }
        updateMarkerAndDisplay();
    }
    btnBirth.addEventListener('click', ()=>setTarget('current'));
    btnCurrent.addEventListener('click', ()=>setTarget('birth'));

    function updateMarkerAndDisplay(){
        const lat = currentTarget==='birth' ? birthLat : curLat;
        const lng = currentTarget==='birth' ? birthLng : curLng;
        if(marker) map.removeLayer(marker);
        marker = L.marker([lat, lng], { draggable: true }).addTo(map);
        marker.on('dragend', ()=>{
            const pos = marker.getLatLng();
            if(currentTarget==='birth'){
                birthLat=pos.lat; birthLng=pos.lng;
                birthLatInp.value=pos.lat.toFixed(4); birthLngInp.value=pos.lng.toFixed(4);
            } else {
                curLat=pos.lat; curLng=pos.lng;
                curLatInp.value=pos.lat.toFixed(4); curLngInp.value=pos.lng.toFixed(4);
            }
            updateTrueSolarTimes();
        });
        map.flyTo([lat, lng], Math.max(map.getZoom(),10), {duration:.5});
        updateTrueSolarTimes();
    }

    function calcTrueSolarTime(dateStr, hour, minute, longitude){
        if(!dateStr || longitude===null || isNaN(longitude)) return null;
        const [y,m,d] = dateStr.split('-').map(Number);
        const birth = new Date(y, m-1, d);
        const doy = Math.floor((birth - new Date(y,0,0))/86400000);
        const B = (2*Math.PI*(doy-1))/365;
        const eot = 229.18*(0.000075+0.001868*Math.cos(B)-0.032077*Math.sin(B)-0.014615*Math.cos(2*B)-0.040849*Math.sin(2*B));
        const totalMin = hour*60 + minute + eot + (longitude-120)*4;
        let adj = totalMin/60; adj = ((adj%24)+24)%24;
        const rh = Math.floor(adj), rm = Math.floor((adj-rh)*60);
        return { hour: rh, minute: rm, display: `${rh.toString().padStart(2,'0')}:${rm.toString().padStart(2,'0')}` };
    }
    function updateTrueSolarTimes(){
        const dateStr = document.getElementById('birthDate').value;
        const hour = parseInt(hourSel.value);
        const minute = parseInt(document.getElementById('minuteSelect').value);
        const birthResult = calcTrueSolarTime(dateStr, hour, minute, birthLng);
        birthTimeDisp.textContent = birthResult ? birthResult.display : '--';
        const curResult = calcTrueSolarTime(dateStr, hour, minute, curLng);
        curTimeDisp.textContent = curResult ? curResult.display : '--';
    }

    map.on('click', e=>{
        if(currentTarget==='birth'){
            birthLat=e.latlng.lat; birthLng=e.latlng.lng;
            birthLatInp.value=birthLat.toFixed(4); birthLngInp.value=birthLng.toFixed(4);
        } else {
            curLat=e.latlng.lat; curLng=e.latlng.lng;
            curLatInp.value=curLat.toFixed(4); curLngInp.value=curLng.toFixed(4);
        }
        updateMarkerAndDisplay();
    });

    function applyBirthInput(){
        const lat=parseFloat(birthLatInp.value), lng=parseFloat(birthLngInp.value);
        if(isNaN(lat)||isNaN(lng)) return;
        if(lat<-90||lat>90||lng<-180||lng>180){ showToast('出生经纬度无效'); return; }
        birthLat=lat; birthLng=lng;
        if(currentTarget==='birth') updateMarkerAndDisplay(); else updateTrueSolarTimes();
    }
    function applyCurInput(){
        const lat=parseFloat(curLatInp.value), lng=parseFloat(curLngInp.value);
        if(isNaN(lat)||isNaN(lng)) return;
        if(lat<-90||lat>90||lng<-180||lng>180){ showToast('当下经纬度无效'); return; }
        curLat=lat; curLng=lng;
        if(currentTarget==='current') updateMarkerAndDisplay(); else updateTrueSolarTimes();
    }
    birthLatInp.addEventListener('change', applyBirthInput); birthLngInp.addEventListener('change', applyBirthInput);
    curLatInp.addEventListener('change', applyCurInput); curLngInp.addEventListener('change', applyCurInput);
    birthLatInp.addEventListener('keydown', e=>{if(e.key==='Enter') applyBirthInput();});
    birthLngInp.addEventListener('keydown', e=>{if(e.key==='Enter') applyBirthInput();});
    curLatInp.addEventListener('keydown', e=>{if(e.key==='Enter') applyCurInput();});
    curLngInp.addEventListener('keydown', e=>{if(e.key==='Enter') applyCurInput();});

    // ---------- 分隔条拖拽缩放 ----------
    const splitter = document.getElementById('splitter');
    const mapContainer = document.getElementById('map-container');
    const sidebar = document.getElementById('sidebar');
    let dragging = false, startX = 0, startW = 0;

    splitter.addEventListener('mousedown', e => {
        e.preventDefault();
        dragging = true; startX = e.clientX; startW = mapContainer.getBoundingClientRect().width;
        splitter.classList.add('active');
        document.body.style.userSelect = 'none';
        document.body.style.cursor = 'col-resize';
    });
    document.addEventListener('mousemove', e => {
        if(!dragging) return;
        const bodyW = document.body.clientWidth;
        const dx = e.clientX - startX;
        const newW = Math.max(bodyW * 0.20, Math.min(bodyW * 0.80, startW + dx));
        mapContainer.style.width = (newW / bodyW * 100) + '%';
    });
    document.addEventListener('mouseup', () => {
        if(!dragging) return;
        dragging = false;
        splitter.classList.remove('active');
        document.body.style.userSelect = '';
        document.body.style.cursor = '';
        map.invalidateSize();
    });

    splitter.addEventListener('touchstart', e => {
        e.preventDefault();
        dragging = true; startX = e.touches[0].clientX; startW = mapContainer.getBoundingClientRect().width;
        splitter.classList.add('active');
    }, { passive: false });
    document.addEventListener('touchmove', e => {
        if(!dragging) return;
        const bodyW = document.body.clientWidth;
        const dx = e.touches[0].clientX - startX;
        const newW = Math.max(bodyW * 0.20, Math.min(bodyW * 0.80, startW + dx));
        mapContainer.style.width = (newW / bodyW * 100) + '%';
    }, { passive: false });
    document.addEventListener('touchend', () => {
        if(!dragging) return;
        dragging = false;
        splitter.classList.remove('active');
        map.invalidateSize();
    });

    // ---------- 表单初始化 ----------
    const hourSel = document.getElementById('hourSelect');
    for(let i=0;i<24;i++) hourSel.appendChild(new Option(i.toString().padStart(2,'0')+'时', i));
    hourSel.value='12';
    document.getElementById('minuteSelect').addEventListener('change', updateTrueSolarTimes);
    hourSel.addEventListener('change', updateTrueSolarTimes);
    document.getElementById('birthDate').addEventListener('change', updateTrueSolarTimes);

    const evYearSel=document.getElementById('evYearSelect'), evMonthSel=document.getElementById('evMonthSelect'),
          evDaySel=document.getElementById('evDaySelect'), evHourSel=document.getElementById('evHourSelect');
    const now=new Date(), curY=now.getFullYear();
    for(let y=curY-30; y<=curY+30; y++) evYearSel.appendChild(new Option(y+'年', y));
    evYearSel.value=curY;
    for(let m=1; m<=12; m++) evMonthSel.appendChild(new Option(m+'月', m));
    function updateEvDayOpts(){
        const y=parseInt(evYearSel.value)||curY;
        const m=parseInt(evMonthSel.value)||1;
        const days=new Date(y,m,0).getDate();
        const curVal=evDaySel.value;
        evDaySel.innerHTML='<option value="">--</option>';
        for(let d=1; d<=days; d++) evDaySel.appendChild(new Option(d+'日', d, d==curVal));
        evDaySel.value = (curVal && curVal<=days) ? curVal : '';
    }
    evYearSel.addEventListener('change', updateEvDayOpts); evMonthSel.addEventListener('change', updateEvDayOpts);
    updateEvDayOpts();
    for(let h=0; h<24; h++) evHourSel.appendChild(new Option(h+'时', h));

    // ================= 完整农历数据 (1900-2099) =================
    const Gan=['甲','乙','丙','丁','戊','己','庚','辛','壬','癸'];
    const Zhi=['子','丑','寅','卯','辰','巳','午','未','申','酉','戌','亥'];
    const lunarInfo = [

    function lunarYearDays(y){

    function leapMonth(y){ return lunarInfo[y-1900]&0xf; }
    function leapDays(y){ return leapMonth(y)?(lunarInfo[y-1900]&0x10000?30:29):0; }
    function monthDays(y,m){ return (lunarInfo[y-1900]&(0x10000>>m))?30:29; }

    function solar2lunar(y,m,d){
            let offset = Math.floor((Date.UTC(y, m-1, d) - Date.UTC(1900, 0, 31)) / 86400000);
        let year = 1900;
        while(year<2100){
            const days = lunarYearDays(year);
            if(offset < days) break;
            offset -= days;
            year++;
        }
        const leap = leapMonth(year);
        let month = 1, day, isLeap = false;
        for(month=1; month<=12; month++){
            let mDays = monthDays(year, month);
            if(offset < mDays){
                day = offset + 1;
                break;
            }
            offset -= mDays;
            if(leap>0 && month===leap){
                const leapDaysCount = leapDays(year);
                if(offset < leapDaysCount){
                    isLeap = true;
                    day = offset + 1;
                    break;
                }
                offset -= leapDaysCount;
            }
        }
        return { year, month, day, isLeap };
    }

        html += `<span style="color:var(--text2)">【流年宫性】</span>${liuInterpret[gongName]||'今年此宫位为流年重点领域，宜关注其主星指引。'}<br>`;
        html += `<span style="color:var(--text2)">【流年干支】</span>${yearGan}${yearZhi} | 流年四化：${huaDesc||'无'}<br>`;
        html += `<span style="color:var(--text2)">【四化详解】</span>${huaDetail||'今年无流年四化影响'}<br>`;
        html += `<span style="color:var(--text2)">【落宫星曜】</span>主星：${stars} | 辅星：${fu} | 生年四化：${hua}<br>`;
        html += `<span style="color:#e0b877">💡 流年精断：${hint}</span></div>`;
        return html;
    }

    function generatePanAnalysis(title, pan, highlightIdx){
        if(highlightIdx === undefined) highlightIdx = -1;
        let an = `<div class="analysis-box">`;
        an += `<h4>📜 ${title}</h4>`;
        an += `<p>农历${pan.lunar.year}年${pan.lunar.month}月${pan.lunar.day}日 真太阳时 ${pan.shiHour}:${pan.shiMinute.toString().padStart(2,'0')} | 命宫: ${DIZHI[pan.mingPos]} | 五行局: ${pan.wuXingJu}局</p>`;
        an += `<table class="chart-table"><tr><th>宫位</th><th>主星</th><th>辅星</th><th>生年四化</th><th>大限</th></tr>`;
        for(let i=0;i<12;i++){
            const starList = pan.stars[i].join(' ') || '—';
            const fuList = pan.fuStars[i].map(s=>`<span class="star-item star-fu">${s}</span>`).join(' ') || '—';
            const hua = Object.entries(pan.siHua).filter(([_,s])=>pan.stars[i].includes(s)).map(([t,s])=>`${s}(${t})`).join(' ')||'-';
            const dax = pan.daXian[i].age ? `${pan.daXian[i].age}岁` : '—';
            const hl = i===highlightIdx ? ' style="background:rgba(201,160,99,0.18);font-weight:bold"' : '';
            an += `<tr${hl}><td>${pan.palaces[i]}</td><td><span class="star-item star-major">${starList}</span></td><td>${fuList}</td><td>${hua}</td><td>${dax}</td></tr>`;
        }
        an += `</table><h4>🏯 各宫释义与建议</h4><div class="palace-grid">`;
        for(let i=0;i<12;i++){
            const adv = palaceAdvice(pan.palaces[i], pan.stars[i]);
            an += `<div class="palace-detail"><strong>${pan.palaces[i]}</strong> <span style="color:var(--text2)">${gongMean[pan.palaces[i]]}</span><br>主星：${pan.stars[i].join('、')||'无'}<br>辅星：${pan.fuStars[i].join('、')||'无'}<br><span style="color:#e0b877;">建议：</span>${adv}</div>`;
        }
        an += `</div>`;
        an += `</div>`;
        return an;
    }

    document.getElementById('btnAnalyze').addEventListener('click',performAnalysis);

    function showToast(msg,t=''){
        const toast=document.getElementById('toast'); toast.textContent=msg; toast.className='toast '+t+' show';
        clearTimeout(toast._t); toast._t=setTimeout(()=>toast.classList.remove('show'),2400);
    }

    // ========== 人物资料存储 ==========
    const STORAGE_KEY = 'ziwei_saved_persons';
    function loadPersons(){
        try{return JSON.parse(localStorage.getItem(STORAGE_KEY)||'[]');} catch(e){return [];}
    }
    function savePersons(persons){
        try{localStorage.setItem(STORAGE_KEY, JSON.stringify(persons)); return true;}
        catch(e){showToast('存储失败：'+(e.name==='QuotaExceededError'?'空间不足':'浏览器不支持本地存储')); return false;}
    }
    function storageAvailable(){
        try{const t='__ziwei_test__'; localStorage.setItem(t,t); localStorage.removeItem(t); return true;}
        catch(e){return false;}
    }

    function getCurrentPersonData(){
        return {
            id: Date.now().toString(),
            name: document.getElementById('nameInput').value.trim()||'未知',
            gender: document.getElementById('genderSelect').value,
            birthDate: document.getElementById('birthDate').value,
            hour: parseInt(hourSel.value),
            minute: parseInt(document.getElementById('minuteSelect').value),
            birthLat: birthLat, birthLng: birthLng,
            curLat: curLat, curLng: curLng
        };
    }

    function loadPersonToForm(p){
        document.getElementById('nameInput').value = p.name;
        document.getElementById('genderSelect').value = p.gender;
        document.getElementById('birthDate').value = p.birthDate;
        hourSel.value = p.hour;
        document.getElementById('minuteSelect').value = p.minute;
        birthLat = p.birthLat; birthLng = p.birthLng;
        birthLatInp.value = birthLat.toFixed(4); birthLngInp.value = birthLng.toFixed(4);
        curLat = p.curLat !== undefined ? p.curLat : p.birthLat;
        curLng = p.curLng !== undefined ? p.curLng : p.birthLng;
        curLatInp.value = curLat.toFixed(4); curLngInp.value = curLng.toFixed(4);
        if(currentTarget==='birth') updateMarkerAndDisplay(); else updateTrueSolarTimes();
        showToast(`已加载"${p.name}"的信息`);
        highlightActivePerson(p.id);
    }

    function highlightActivePerson(id){
        document.querySelectorAll('.person-item').forEach(el => el.classList.remove('active'));
        const items = document.querySelectorAll('.person-item');
        items.forEach(el => { if(el.dataset.pid === id) el.classList.add('active'); });
    }

    function deletePerson(index){
        const persons = loadPersons();
        const name = persons[index].name;
        if(!confirm(`确定删除"${name}"的记录吗？`)) return;
        persons.splice(index, 1);
        savePersons(persons);
        renderPersonList();
        showToast(`已删除"${name}"`);
    }

    function openEditModal(person, index){
        const overlay = document.createElement('div');
        overlay.className = 'modal-overlay';
        overlay.innerHTML = `<div class="modal-box" onclick="event.stopPropagation()">
            <h3>修改 "${person.name}" 的信息</h3>
            <div class="form-row">
                <div class="form-group"><label>姓名</label><input id="editName" value="${person.name.replace(/"/g,'&quot;')}"></div>
                <div class="form-group"><label>性别</label><select id="editGender"><option value="male" ${person.gender==='male'?'selected':''}>男</option><option value="female" ${person.gender==='female'?'selected':''}>女</option></select></div>
            </div>
            <div class="form-row" style="margin-top:8px">
                <div class="form-group"><label>出生日期</label><input type="date" id="editDate" value="${person.birthDate}"></div>
                <div class="form-group"><label>小时</label><input type="number" id="editHour" min="0" max="23" value="${person.hour}" style="width:60px"></div>
                <div class="form-group"><label>分钟</label><input type="number" id="editMinute" min="0" max="59" value="${person.minute}" style="width:60px"></div>
            </div>
            <div class="form-row" style="margin-top:8px">
                <div class="form-group"><label>出生经度</label><input type="number" id="editBLng" step="any" value="${person.birthLng}"></div>
                <div class="form-group"><label>出生纬度</label><input type="number" id="editBLat" step="any" value="${person.birthLat}"></div>
            </div>
            <div class="form-row" style="margin-top:8px">
                <div class="form-group"><label>当下经度</label><input type="number" id="editCLng" step="any" value="${person.curLng !== undefined ? person.curLng : person.birthLng}"></div>
                <div class="form-group"><label>当下纬度</label><input type="number" id="editCLat" step="any" value="${person.curLat !== undefined ? person.curLat : person.birthLat}"></div>
            </div>
            <div class="modal-actions">
                <button class="btn btn-sm" id="editCancel">取消</button>
                <button class="btn btn-accent btn-sm" id="editSave">保存修改</button>
            </div>
        </div>`;
        document.body.appendChild(overlay);
        overlay.addEventListener('click', () => overlay.remove());
        overlay.querySelector('#editCancel').addEventListener('click', () => overlay.remove());
        overlay.querySelector('#editSave').addEventListener('click', () => {
            person.name = document.getElementById('editName').value.trim() || '未知';
            person.gender = document.getElementById('editGender').value;
            person.birthDate = document.getElementById('editDate').value;
            person.hour = parseInt(document.getElementById('editHour').value) || 0;
            person.minute = parseInt(document.getElementById('editMinute').value) || 0;
            person.birthLng = parseFloat(document.getElementById('editBLng').value) || 0;
            person.birthLat = parseFloat(document.getElementById('editBLat').value) || 0;
            person.curLng = parseFloat(document.getElementById('editCLng').value) || 0;
            person.curLat = parseFloat(document.getElementById('editCLat').value) || 0;
            const persons = loadPersons();
            persons[index] = person;
            savePersons(persons);
            overlay.remove();
            renderPersonList();
            showToast(`"${person.name}" 已更新`);
        });
    }

    function renderPersonList(){
        const persons = loadPersons();
        const container = document.getElementById('personList');
        container.innerHTML = '';
        if(persons.length === 0){
            container.innerHTML = '<span style="color:var(--text2);font-size:.7rem">暂无保存资料</span>';
            return;
        }
        persons.forEach((p, i) => {
            const div = document.createElement('div');
            div.className = 'person-item';
            div.dataset.pid = p.id;
            div.title = '点击加载此人信息';
            div.innerHTML = `<span class="pname">${p.name}</span><span class="pinfo">${p.gender==='male'?'♂':'♀'} ${p.birthDate}</span>
                <button class="pedit" title="修改">✎</button>
                <button class="pdel" title="删除">✕</button>`;
            div.addEventListener('click', (e) => {
                if(e.target.classList.contains('pedit')) return openEditModal(p, i);
                if(e.target.classList.contains('pdel')) return deletePerson(i);
                loadPersonToForm(p);
            });
            container.appendChild(div);
        });
    }

    document.getElementById('btnSavePerson').addEventListener('click', () => {
        const data = getCurrentPersonData();
        const persons = loadPersons();
        const idx = persons.findIndex(p => p.name === data.name && p.birthDate === data.birthDate);
        if(idx >= 0){
            if(!confirm(`已存在"${data.name}"(${data.birthDate})的记录，是否覆盖？`)) return;
            persons[idx] = { ...persons[idx], ...data, id: persons[idx].id };
        } else {
            persons.push(data);
        }
        savePersons(persons);
        renderPersonList();
        highlightActivePerson(persons[idx >= 0 ? idx : persons.length-1].id);
        showToast('保存成功');
    });

    document.getElementById('btnExportJson').addEventListener('click', async () => {
        const persons = loadPersons();
        if(persons.length===0) return showToast('没有可导出的数据');
        const json = JSON.stringify(persons, null, 2);
        const filename = '紫微斗数人物资料_' + new Date().toISOString().slice(0,10) + '.json';
        const blob = new Blob([json], {type: 'application/json'});
        // 移动端优先使用 Share API
        if(navigator.share && navigator.canShare){
            try{
                const file = new File([blob], filename, {type: 'application/json'});
                await navigator.share({files: [file], title: '导出人物资料'});
                showToast(`已分享 ${persons.length} 条记录`);
                return;
            }catch(e){}
        }
        // 桌面端使用 Blob 下载
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url; a.download = filename;
        a.click();
        setTimeout(() => URL.revokeObjectURL(url), 3000);
        showToast(`已导出 ${persons.length} 条记录`);
    });

    document.getElementById('btnImportJson').addEventListener('click', () => {
        document.getElementById('importFileInput').click();
    });

    document.getElementById('importFileInput').addEventListener('change', (e) => {
        const file = e.target.files[0];
        if(!file) return;
        const reader = new FileReader();
        reader.onload = (ev) => {
            try{
                const imported = JSON.parse(ev.target.result);
                if(!Array.isArray(imported)) throw new Error('格式不正确');
                const persons = loadPersons();
                let merged = 0;
                imported.forEach(imp => {
                    const idx = persons.findIndex(p => p.id === imp.id);
                    if(idx >= 0){ persons[idx] = imp; } else { persons.push(imp); merged++; }
                });
                savePersons(persons);
                renderPersonList();
                showToast(`导入完成：${imported.length} 条记录（新增 ${merged} 条）`);
            }catch(err){
                showToast('导入失败：文件格式不正确');
            }
        };
        reader.readAsText(file);
        e.target.value = '';
    });

    document.getElementById('btnClearData').addEventListener('click', () => {
        const persons = loadPersons();
        if(persons.length===0) return showToast('没有需要清空的数据');
        if(!confirm(`确定清空全部 ${persons.length} 条人物资料吗？此操作不可恢复。\n建议先导出备份。`)) return;
        localStorage.removeItem(STORAGE_KEY);
        renderPersonList();
        showToast('已清空全部本地人物数据');
    });

    function buildResultPage(name, birthPan, evTime, evPan, curLngVal, gender, currentAge){
        const evDesc = evTime.year ? `${evTime.year}年${evTime.month>0?evTime.month+'月':''}${evTime.day>0?evTime.day+'日':''}${evTime.hour>=0?evTime.hour+'时':''}` : '--';
        const cssVars = `--bg:#0f0f11;--panel:#1a1c22;--panel2:#21242c;--border:#2d3039;--text:#e0e2e8;--text2:#9a9da8;--accent:#c9a063`;
        const initEv = JSON.stringify({y:evTime.year,m:evTime.month,d:evTime.day,h:evTime.hour});
        const birthData = JSON.stringify({stars:birthPan.stars,fuStars:birthPan.fuStars,siHua:birthPan.siHua,palaces:birthPan.palaces,daXian:birthPan.daXian});
        const birthYear = evTime.year - currentAge;
        const daXianIdx = getCurrentDaXianIdx(birthPan, currentAge);

        return `<!DOCTYPE html>
<html lang="zh-CN">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>${name} 紫微斗数命盘</title>

<body>
<div class="result-header">
    <h1>☯ ${name} 紫微斗数命盘</h1>

</div>
<div id="birthPanSection">

</div>

<p style="font-size:.75rem;color:var(--text2);text-align:center;margin-bottom:12px">基于出生命盘推演</p>
<div class="analysis-box" id="daxianSection">
    <h4>📆 大限精断</h4>
    ${generateDaXianAnalysis(birthPan, currentAge, birthYear)}
</div>
<div class="analysis-box" id="liunianSection">
    <h4>📅 流年精断（${evTime.year}年）</h4>
    ${generateLiuNianAnalysis(birthPan, evTime.year, evTime.month, evTime.day, evTime.hour)}
</div>
<div class="footer-bar">
    <button class="btn-back" onclick="window.close()">← 返回主页面</button>

<script>
(() => {
    const PAGE = {
        curLng: ${curLngVal},
        gender: '${gender}',
        initEv: ${initEv},
        birthData: ${birthData}
    };

    // ============ 排盘算法 ============

    function performAnalysis(){
        try{
            const name = document.getElementById('nameInput').value.trim()||'未知';
            const birthDate = document.getElementById('birthDate').value;
            const hour = parseInt(hourSel.value);
            const minute = parseInt(document.getElementById('minuteSelect').value);
            const gender = document.getElementById('genderSelect').value;
            if(!birthDate || isNaN(birthLat)||isNaN(birthLng)) throw new Error('出生日期与出生地点必须完整填写');
            const [by,bm,bd] = birthDate.split('-').map(Number);
            const birthPan = generatePan(by,bm,bd,hour,minute,gender,birthLng);

            const evYear = parseInt(evYearSel.value);
            if(!evYear) throw new Error('评估年份必须选择');
            const evMonthVal = evMonthSel.value ? parseInt(evMonthSel.value) : 0;
            const evDayVal = evDaySel.value ? parseInt(evDaySel.value) : 0;
            const evHourVal = evHourSel.value !== '' ? parseInt(evHourSel.value) : -1;
            if(isNaN(curLat)||isNaN(curLng)) throw new Error('当下地点必须填写');
            const evPan = generatePan(evYear, evMonthVal||1, evDayVal||1, evHourVal>=0 ? evHourVal : 0, 0, gender, curLng);
            const currentAge = evYear - by;

            const resultHTML = buildResultPage(name, birthPan, {year:evYear,month:evMonthVal,day:evDayVal,hour:evHourVal}, evPan, curLng, gender, currentAge);
            const blob = new Blob([resultHTML], {type: 'text/html;charset=utf-8'});
            const url = URL.createObjectURL(blob);
            const win = window.open(url, '_blank');
            if(!win) throw new Error('弹窗被浏览器拦截，请允许弹窗后重试');
            setTimeout(() => URL.revokeObjectURL(url), 30000);
            document.getElementById('resultPanel').innerHTML = '<div style="text-align:center;color:var(--accent);padding:20px">✅ 排盘结果已在新窗口打开</div>';
            showToast('排盘完成','success');
        }catch(e){
            document.getElementById('resultPanel').innerHTML = `<div style="color:#f85149;padding:20px;text-align:center">⚠️ 排盘异常：${e.message}</div>`;
            showToast('排盘失败: '+e.message,'error');
        }
    }
