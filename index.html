<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>紫微斗数 · 真太阳时精断 beta v1.04</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<style>
:root{--bg:#0f0f11;--panel:#1a1c22;--panel2:#21242c;--border:#2d3039;--text:#e0e2e8;--text2:#9a9da8;--accent:#c9a063;--radius:16px;--radius-sm:8px}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);height:100vh;width:100vw;overflow:hidden;display:flex}
#map-container{width:50%;min-width:0;height:100vh;position:relative;flex-shrink:0;overflow:hidden}
#map{position:absolute;top:0;left:0;right:0;bottom:0}
.coord-tag{position:absolute;bottom:18px;left:50%;transform:translateX(-50%);background:rgba(26,28,34,0.9);border:1px solid var(--border);border-radius:20px;padding:8px 16px;font-size:.85rem;z-index:1000;display:flex;gap:12px;align-items:center;color:var(--text2);pointer-events:none}
.splitter{width:6px;height:100vh;background:var(--panel2);cursor:col-resize;flex-shrink:0;user-select:none;border-left:1px solid var(--border);border-right:1px solid var(--border)}
.splitter:hover,.splitter.active{background:var(--accent)}
.splitter-handle{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:24px;height:48px;background:var(--panel2);border:1px solid var(--border);border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;pointer-events:none;transition:background .2s}
.splitter:hover .splitter-handle,.splitter.active .splitter-handle{background:var(--accent);border-color:var(--accent)}
.splitter-handle::before{content:'';width:14px;height:2px;background:var(--text2);border-radius:1px}
.splitter-handle::after{content:'';width:14px;height:2px;background:var(--text2);box-shadow:0 6px 0 var(--text2);border-radius:1px}
.splitter:hover .splitter-handle::before,.splitter.active .splitter-handle::before,.splitter:hover .splitter-handle::after,.splitter.active .splitter-handle::after{background:var(--bg);box-shadow:0 6px 0 var(--bg)}
#sidebar{flex:1;height:100vh;background:var(--panel);display:flex;flex-direction:column;overflow-y:auto;z-index:10;min-width:0}
.sidebar-header{padding:20px 24px 10px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px}
.sidebar-header .icon{width:36px;height:36px;background:linear-gradient(135deg,#c9a063,#7b5e3b);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:1.2rem;color:#fff}
.section{padding:16px 24px;border-bottom:1px solid var(--border)}
.section-title{font-size:.8rem;text-transform:uppercase;color:var(--accent);margin-bottom:12px;font-weight:600}
.form-row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
.form-group{display:flex;flex-direction:column;gap:4px;min-width:75px}
.form-group label{font-size:.7rem;color:var(--text2);white-space:nowrap}
.form-group input,.form-group select{padding:8px 10px;border-radius:var(--radius-sm);border:1.5px solid var(--border);background:var(--panel2);color:var(--text);font-size:.85rem;outline:none;font-family:inherit}
.btn{padding:10px 20px;border-radius:25px;border:1.5px solid var(--border);background:var(--panel2);color:var(--text);cursor:pointer;font-size:.9rem}
.btn:hover{background:#2a2e3a}
.btn-accent{background:var(--accent);border-color:var(--accent);color:#0f0f11;font-weight:700}
.btn-sm{padding:6px 12px;font-size:.8rem}
.btn-xs{padding:4px 10px;font-size:.7rem;border-radius:15px}
.btn-danger{border-color:#f85149;color:#f85149}
.btn-danger:hover{background:rgba(248,81,73,0.15)}
.coord-display{display:flex;gap:16px;flex-wrap:wrap;font-size:.85rem;background:var(--panel2);padding:10px 16px;border-radius:var(--radius-sm);margin-top:8px}
.coord-val{font-family:'SF Mono',monospace;color:var(--accent);font-weight:600}
.person-list{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.person-item{display:flex;align-items:center;gap:6px;background:var(--panel2);padding:6px 14px;border-radius:20px;font-size:.8rem;border:1px solid var(--border);cursor:pointer}
.person-item:hover{border-color:var(--accent)}
.person-item.active{border-color:var(--accent);background:rgba(201,160,99,0.15)}
.person-item .pname{color:var(--accent);font-weight:600;white-space:nowrap;max-width:80px;overflow:hidden;text-overflow:ellipsis}
.person-item .pinfo{color:var(--text2);font-size:.7rem;white-space:nowrap}
.person-item .pdel,.person-item .pedit{width:20px;height:20px;line-height:18px;text-align:center;border-radius:50%;background:transparent;border:none;color:var(--text2);cursor:pointer;font-size:.75rem;padding:0;flex-shrink:0}
.person-item .pdel:hover{color:#f85149;background:rgba(248,81,73,0.15)}
.person-item .pedit:hover{color:var(--accent);background:rgba(201,160,99,0.15)}
.modal-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.6);z-index:9000;display:flex;align-items:center;justify-content:center}
.modal-box{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:24px;min-width:360px;max-width:90vw;max-height:90vh;overflow-y:auto}
.modal-box h3{color:var(--accent);margin-bottom:16px;font-size:1rem}
.modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
.modal-box .form-group{margin-bottom:8px}
.result-panel{flex:1;overflow-y:auto;padding:16px 24px}
.toast{position:fixed;top:20px;left:50%;transform:translateX(-50%) translateY(-120px);z-index:9999;background:var(--panel2);color:var(--text);padding:10px 22px;border-radius:25px;border:1px solid var(--border);transition:transform .3s;pointer-events:none;font-size:.9rem}
.toast.show{transform:translateX(-50%) translateY(0)}
.fullscreen-modal{position:fixed;top:0;left:0;right:0;bottom:0;z-index:99999;background:#0f0f11;overflow-y:auto;padding:20px}
.fullscreen-modal .r-close{position:fixed;top:10px;right:14px;z-index:10;padding:8px 18px;border-radius:20px;border:1.5px solid #2d3039;background:#21242c;color:#e0e2e8;cursor:pointer;font-size:.85rem;font-family:inherit}
</style>
<style id="resultStyles">
.r-body{font-family:'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;background:#0f0f11;color:#e0e2e8;min-height:100vh;padding:20px}
.r-header{display:flex;align-items:center;gap:16px;padding:16px 24px;background:#1a1c22;border:1px solid #2d3039;border-radius:16px;margin-bottom:20px;flex-wrap:wrap}
.r-header h1{font-size:1.3rem;color:#c9a063;flex:1;min-width:150px}
.r-btn{padding:8px 18px;border-radius:20px;border:1.5px solid #2d3039;background:#21242c;color:#e0e2e8;cursor:pointer;font-size:.85rem;font-family:inherit}
.r-btn:hover{background:#2a2e3a}
.r-ctl{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:12px 16px;background:#1a1c22;border:1px solid #2d3039;border-radius:12px;margin-bottom:20px}
.r-ctl label{font-size:.8rem;color:#c9a063;font-weight:600;white-space:nowrap}
.r-ctl select{padding:6px 10px;border-radius:8px;border:1.5px solid #2d3039;background:#21242c;color:#e0e2e8;font-size:.8rem;outline:none;font-family:inherit}
.r-ctl .btn-go{padding:6px 16px;border-radius:20px;border:none;background:#c9a063;color:#0f0f11;cursor:pointer;font-size:.8rem;font-weight:700;font-family:inherit}
.r-ctl .btn-go:hover{opacity:.85}
.r-box{background:#21242c;border-radius:8px;padding:16px;margin-bottom:16px;font-size:.85rem;line-height:1.7;color:#d0d2d8}
.r-box h4{color:#c9a063;margin:12px 0 8px;font-size:.95rem;border-left:3px solid #c9a063;padding-left:8px}
.r-box p{font-size:.82rem;color:#9a9da8;margin-bottom:8px}
.r-table{width:100%;border-collapse:collapse;font-size:.75rem;margin:16px 0;background:#1a1c22;border-radius:8px;overflow:hidden}
.r-table th{background:#2a2e3a;padding:8px 6px;color:#c9a063;font-weight:600;border:1px solid #2d3039}
.r-table td{padding:6px;border:1px solid #2d3039;text-align:center;vertical-align:top}
.r-star{display:inline-block;background:rgba(201,160,99,0.15);padding:2px 6px;border-radius:12px;margin:1px;font-size:.7rem}
.r-star-m{color:#e0b877}
.r-star-f{color:#a1b0cc;font-size:.65rem}
.r-pd{background:rgba(201,160,99,0.05);border:1px solid #c9a063;padding:8px 10px;margin:6px 0;border-radius:4px;font-size:.8rem}
.r-pg{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:6px}
.r-hr{border-color:#2d3039;margin:20px 0}
.r-fn{color:#e0b877;font-size:.8rem;margin-bottom:12px}
.r-footer{display:flex;justify-content:center;gap:12px;margin-top:20px;padding-bottom:20px}
.r-note{font-size:.75rem;color:#9a9da8;text-align:center;margin-bottom:12px}
.r-err{color:#f85149;padding:20px;text-align:center}
@media(max-width:768px){.r-body{padding:10px}.r-header{flex-direction:column;align-items:flex-start;padding:12px 16px;gap:8px}.r-header h1{font-size:1.1rem}.r-ctl{flex-direction:column;align-items:flex-start;padding:10px 12px;gap:6px}.r-ctl select{padding:5px 8px;font-size:.75rem}.r-table{font-size:.62rem;display:block;overflow-x:auto;-webkit-overflow-scrolling:touch}.r-table th,.r-table td{padding:4px 2px;white-space:nowrap}.r-pg{grid-template-columns:1fr;gap:4px}.r-footer{flex-wrap:wrap;gap:8px}}
</style>
<style>
@media(max-width:768px){
body{flex-direction:column;overflow-y:auto}
#map-container{width:100%!important;height:35vh!important;flex-shrink:initial}
#sidebar{flex:none;width:100%!important;height:auto;max-height:65vh;overflow-y:auto;-webkit-overflow-scrolling:touch}
#splitter{display:none}
.splitter-handle{display:none}
.sidebar-header{padding:12px 16px 8px}
.sidebar-header h2{font-size:1rem}
.sidebar-header .icon{width:28px;height:28px;font-size:1rem}
.section{padding:12px 16px}
.section-title{font-size:.75rem}
.form-group{min-width:60px}
.form-group input,.form-group select{padding:7px 8px;font-size:.8rem}
.form-row{gap:6px}
.btn{padding:8px 14px;font-size:.82rem}
.btn-sm{padding:5px 10px;font-size:.75rem}
.btn-xs{padding:4px 8px;font-size:.7rem}
.coord-display{flex-direction:column;gap:6px;font-size:.78rem}
.person-item{padding:5px 10px;font-size:.75rem}
.person-item .pname{max-width:60px;font-size:.75rem}
.person-list{gap:6px}
.modal-box{min-width:auto;width:95vw;padding:16px;max-height:80vh}
.result-panel{padding:10px 12px}
.toast{font-size:.8rem;padding:8px 16px;max-width:90vw;text-align:center}
}
</style>
</head>
<body>
<div id="map-container"><div id="map"></div><div class="coord-tag"><span>📍</span><span id="coordText">点击地图选择出生地点</span></div></div>
<div id="splitter" class="splitter"><div class="splitter-handle"></div></div>
<div id="sidebar">
<div class="sidebar-header"><div class="icon">☯</div><h2>紫微斗数 · 真太阳时精断 <span style="font-size:.55rem;color:var(--text2);font-weight:400">beta v1.04 · 朱雀</span></h2></div>
<div class="section">
<div class="section-title">👤 基本信息</div>
<div class="form-row">
<div class="form-group"><label>姓名</label><input type="text" id="nameInput" value="东方"></div>
<div class="form-group"><label>性别</label><select id="genderSelect"><option value="male">男</option><option value="female">女</option></select></div>
<div class="form-group"><label>出生日期</label><input type="date" id="birthDate" value="1990-06-15"></div>
</div>
<div class="form-row" style="margin-top:10px">
<div class="form-group"><label>出生小时</label><select id="hourSelect"></select></div>
<div class="form-group"><label>分钟</label><select id="minuteSelect"><option value="0">00</option><option value="15">15</option><option value="30">30</option><option value="45">45</option></select></div>
</div>
<div class="form-row" style="margin-top:8px">
<div class="form-group"><label>出生经度</label><input type="number" id="birthLngInput" step="any" value="108.9398"></div>
<div class="form-group"><label>出生纬度</label><input type="number" id="birthLatInput" step="any" value="34.3416"></div>
<button class="btn btn-sm" id="btnTargetBirth">🎯 点选出生地</button>
</div>
<div class="form-row" style="margin-top:8px">
<div class="form-group"><label>当下经度</label><input type="number" id="curLngInput" step="any" value="108.9398"></div>
<div class="form-group"><label>当下纬度</label><input type="number" id="curLatInput" step="any" value="34.3416"></div>
<button class="btn btn-sm" id="btnTargetCurrent" style="display:none">🎯 点选当下地</button>
</div>
<div class="coord-display">
<span>🕒 出生真太阳时: <span class="coord-val" id="birthTimeDisplay">--</span></span>
<span>🕒 当下真太阳时: <span class="coord-val" id="curTimeDisplay">--</span></span>
</div>
</div>
<div class="section">
<div class="section-title">📅 运势评估时间 (年必选，月日时可选)</div>
<div class="form-row">
<div class="form-group"><label>年份*</label><select id="evYearSelect"></select></div>
<div class="form-group"><label>月份</label><select id="evMonthSelect"><option value="">--</option></select></div>
<div class="form-group"><label>日</label><select id="evDaySelect"><option value="">--</option></select></div>
<div class="form-group"><label>时</label><select id="evHourSelect"><option value="">--</option></select></div>
</div>
<div style="margin-top:8px;font-size:.75rem;color:var(--text2)">月/日/时未选则按年初粗略估算</div>
<button class="btn btn-accent" style="margin-top:12px" id="btnAnalyze">🔮 开始排盘分析</button>
</div>
<div class="section">
<div class="section-title">💾 人物资料保存 <span style="font-size:.65rem;color:var(--text2)">· 数据仅存本机</span></div>
<div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">
<button class="btn btn-sm" id="btnSavePerson">💾 保存</button>
<button class="btn btn-xs" id="btnExportJson">📤 导出JSON</button>
<button class="btn btn-xs" id="btnImportJson">📥 导入JSON</button>
<button class="btn btn-xs btn-danger" id="btnClearData">🗑 清空数据</button>
</div>
<div style="font-size:.65rem;color:var(--text2);margin-top:4px">数据仅保存在当前浏览器本地存储，不会上传到任何服务器。建议定期导出备份。</div>
<div class="person-list" id="personList"></div>
<input type="file" id="importFileInput" accept=".json" style="display:none">
</div>
<div class="result-panel" id="resultPanel"><div style="text-align:center;color:var(--text2);padding:20px">⬆️ 填写信息后点击按钮排盘</div></div>
</div>
<div class="toast" id="toast"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
(()=>{

// ==================== 地图模块 ====================
const map = L.map('map', { center: [34.3416, 108.9398], zoom: 5, zoomControl: true });
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { attribution: '&copy; OSM', maxZoom: 19 }).addTo(map);
setTimeout(() => map.invalidateSize(), 200);

let birthLat = 34.3416, birthLng = 108.9398, curLat = 34.3416, curLng = 108.9398, currentTarget = 'birth', marker = null;
const birthLatInp = document.getElementById('birthLatInput'), birthLngInp = document.getElementById('birthLngInput'),
      curLatInp = document.getElementById('curLatInput'), curLngInp = document.getElementById('curLngInput'),
      coordText = document.getElementById('coordText'), btnBirth = document.getElementById('btnTargetBirth'),
      btnCurrent = document.getElementById('btnTargetCurrent'), birthTimeDisp = document.getElementById('birthTimeDisplay'),
      curTimeDisp = document.getElementById('curTimeDisplay'), hourSel = document.getElementById('hourSelect'),
      minuteSel = document.getElementById('minuteSelect'), birthDateSel = document.getElementById('birthDate');

for(let i=0;i<24;i++) hourSel.appendChild(new Option(i.toString().padStart(2,'0')+'时', i)); hourSel.value='12';

function setTarget(target){
    currentTarget = target;
    btnBirth.style.display = target==='birth'?'inline-flex':'none';
    btnCurrent.style.display = target==='birth'?'none':'inline-flex';
    coordText.textContent = target==='birth'?'🎯 正在点选：出生地':'🎯 正在点选：当下地';
    updateMarkerAndDisplay();
}
btnBirth.addEventListener('click', ()=>setTarget('current'));
btnCurrent.addEventListener('click', ()=>setTarget('birth'));

function updateMarkerAndDisplay(){
    const lat = currentTarget==='birth'?birthLat:curLat, lng = currentTarget==='birth'?birthLng:curLng;
    if(marker) map.removeLayer(marker);
    marker = L.marker([lat, lng], { draggable: true }).addTo(map);
    marker.on('dragend', ()=>{
        const pos = marker.getLatLng();
        if(currentTarget==='birth'){ birthLat=pos.lat; birthLng=pos.lng; birthLatInp.value=pos.lat.toFixed(4); birthLngInp.value=pos.lng.toFixed(4); }
        else { curLat=pos.lat; curLng=pos.lng; curLatInp.value=pos.lat.toFixed(4); curLngInp.value=pos.lng.toFixed(4); }
        updateTrueSolarTimes();
    });
    map.flyTo([lat, lng], Math.max(map.getZoom(),10), {duration:.5});
    updateTrueSolarTimes();
}

function calcTrueSolarTime(dateStr, hour, minute, longitude){
    if(!dateStr || longitude===null || isNaN(longitude)) return null;
    const [y,m,d] = dateStr.split('-').map(Number);
    const birth = new Date(y, m-1, d);
    const doy = Math.floor((birth - new Date(y,0,0))/86400000);
    const B = (2*Math.PI*(doy-1))/365;
    const eot = 229.18*(0.000075+0.001868*Math.cos(B)-0.032077*Math.sin(B)-0.014615*Math.cos(2*B)-0.040849*Math.sin(2*B));
    const totalMin = hour*60 + minute + eot + (longitude-120)*4;
    let adj = totalMin/60; adj = ((adj%24)+24)%24;
    const rh = Math.floor(adj), rm = Math.floor((adj-rh)*60);
    return { hour: rh, minute: rm, display: rh.toString().padStart(2,'0')+':'+rm.toString().padStart(2,'0') };
}
function updateTrueSolarTimes(){
    const dateStr = birthDateSel.value, h = parseInt(hourSel.value), min = parseInt(minuteSel.value);
    const br = calcTrueSolarTime(dateStr, h, min, birthLng); birthTimeDisp.textContent = br?br.display:'--';
    const cr = calcTrueSolarTime(dateStr, h, min, curLng); curTimeDisp.textContent = cr?cr.display:'--';
}
map.on('click', e=>{
    if(currentTarget==='birth'){ birthLat=e.latlng.lat; birthLng=e.latlng.lng; birthLatInp.value=birthLat.toFixed(4); birthLngInp.value=birthLng.toFixed(4); }
    else { curLat=e.latlng.lat; curLng=e.latlng.lng; curLatInp.value=curLat.toFixed(4); curLngInp.value=curLng.toFixed(4); }
    updateMarkerAndDisplay();
});
function applyBirthInput(){
    const lat=parseFloat(birthLatInp.value), lng=parseFloat(birthLngInp.value);
    if(isNaN(lat)||isNaN(lng)||lat<-90||lat>90||lng<-180||lng>180){ showToast('出生经纬度无效'); return; }
    birthLat=lat; birthLng=lng; if(currentTarget==='birth') updateMarkerAndDisplay(); else updateTrueSolarTimes();
}
function applyCurInput(){
    const lat=parseFloat(curLatInp.value), lng=parseFloat(curLngInp.value);
    if(isNaN(lat)||isNaN(lng)||lat<-90||lat>90||lng<-180||lng>180){ showToast('当下经纬度无效'); return; }
    curLat=lat; curLng=lng; if(currentTarget==='current') updateMarkerAndDisplay(); else updateTrueSolarTimes();
}
birthLatInp.addEventListener('change',applyBirthInput); birthLngInp.addEventListener('change',applyBirthInput);
curLatInp.addEventListener('change',applyCurInput); curLngInp.addEventListener('change',applyCurInput);
[birthLatInp,birthLngInp,curLatInp,curLngInp].forEach(el=>el.addEventListener('keydown',e=>{if(e.key==='Enter')el.dispatchEvent(new Event('change'));}));
birthDateSel.addEventListener('change',updateTrueSolarTimes); hourSel.addEventListener('change',updateTrueSolarTimes);
minuteSel.addEventListener('change',updateTrueSolarTimes);

// ==================== 分隔条拖拽 ====================
const sp = document.getElementById('splitter'), mc = document.getElementById('map-container');
let dragging = false, startX = 0, startW = 0;
sp.addEventListener('mousedown', e => {
    e.preventDefault(); dragging = true; startX = e.clientX; startW = mc.getBoundingClientRect().width;
    sp.classList.add('active'); document.body.style.userSelect = 'none'; document.body.style.cursor = 'col-resize';
});
document.addEventListener('mousemove', e => {
    if(!dragging) return; const bw = document.body.clientWidth, dx = e.clientX - startX;
    const nw = Math.max(bw*0.20, Math.min(bw*0.80, startW + dx)); mc.style.width = (nw/bw*100)+'%';
});
document.addEventListener('mouseup', ()=>{ if(!dragging) return; dragging = false; sp.classList.remove('active'); document.body.style.userSelect = ''; document.body.style.cursor = ''; map.invalidateSize(); });
sp.addEventListener('touchstart', e => { e.preventDefault(); dragging = true; startX = e.touches[0].clientX; startW = mc.getBoundingClientRect().width; sp.classList.add('active'); }, {passive:false});

// ==================== generatePanAnalysis ====================
function generatePanAnalysis(title, pan, fuzzyNote){
    let a = '<div class="r-box">';
    a += '<h4>📜 '+title+'</h4>';
    if(fuzzyNote) a += '<p class="r-fn">'+fuzzyNote+'</p>';
    a += '<p>农历'+pan.lunar.year+'年'+pan.lunar.month+'月'+pan.lunar.day+'日 真太阳时 '+pan.shiHour+':'+pan.shiMinute.toString().padStart(2,'0')+' | 命宫: '+DIZHI[pan.mingPos]+' | 五行局: '+pan.wuXingJu+'局</p>';
    a += '<table class="r-table"><tr><th>宫位</th><th>主星</th><th>辅星</th><th>生年四化</th><th>大限</th></tr>';
    for(let i=0;i<12;i++){
        const sl = pan.stars[i].join(' ') || '—';
        const fl = pan.fuStars[i].map(s=>'<span class="r-star r-star-f">'+s+'</span>').join(' ') || '—';
        const h = Object.entries(pan.siHua).filter(([_,s])=>pan.stars[i].includes(s)).map(([t,s])=>s+'('+t+')').join(' ')||'-';
        const dx = pan.daXian[i].age ? pan.daXian[i].age+'岁' : '—';
        a += '<tr><td>'+pan.palaces[i]+'</td><td><span class="r-star r-star-m">'+sl+'</span></td><td>'+fl+'</td><td>'+h+'</td><td>'+dx+'</td></tr>';
    }
    a += '</table><h4>🏯 各宫释义与建议</h4><div class="r-pg">';
    for(let i=0;i<12;i++){
        const adv = palaceAdvice(pan.palaces[i], pan.stars[i], pan.fuStars[i]);
        a += '<div class="r-pd"><strong>'+pan.palaces[i]+'</strong> <span style="color:#9a9da8">'+gongMean[pan.palaces[i]]+'</span><br>主星：'+(pan.stars[i].join('、')||'无')+'<br>辅星：'+(pan.fuStars[i].join('、')||'无')+'<br><span style="color:#e0b877;">建议：</span>'+adv+'</div>';
    }
    a += '</div></div>';
    return a;
}

const STORAGE_KEY = 'ziweimk2_persons';
function loadPersons(){ try{return JSON.parse(localStorage.getItem(STORAGE_KEY)||'[]');}catch(e){return[];} }
function savePersons(p){ try{localStorage.setItem(STORAGE_KEY,JSON.stringify(p));return true;}catch(e){showToast('存储失败：'+(e.name==='QuotaExceededError'?'空间不足':'浏览器不支持'));return false;} }
function storageAvailable(){ try{const t='_test_';localStorage.setItem(t,t);localStorage.removeItem(t);return true;}catch(e){return false;} }
function getCurrentPersonData(){ return {id:Date.now().toString(),name:document.getElementById('nameInput').value.trim()||'未知',gender:document.getElementById('genderSelect').value,birthDate:document.getElementById('birthDate').value,hour:parseInt(hourSel.value),minute:parseInt(minuteSel.value),birthLat,birthLng,curLat,curLng}; }
function loadToForm(p){
    document.getElementById('nameInput').value=p.name; document.getElementById('genderSelect').value=p.gender;
    document.getElementById('birthDate').value=p.birthDate; hourSel.value=p.hour; minuteSel.value=p.minute;
    birthLat=p.birthLat; birthLng=p.birthLng; curLat=p.curLat||p.birthLat; curLng=p.curLng||p.birthLng;
    birthLatInp.value=birthLat.toFixed(4); birthLngInp.value=birthLng.toFixed(4);
    curLatInp.value=curLat.toFixed(4); curLngInp.value=curLng.toFixed(4);
    if(currentTarget==='birth') updateMarkerAndDisplay(); else updateTrueSolarTimes();
    showToast('已加载"'+p.name+'"的信息');
}
function renderPersonList(){
    const persons = loadPersons(), c = document.getElementById('personList'); c.innerHTML = '';
    if(persons.length===0){ c.innerHTML='<span style="color:var(--text2);font-size:.7rem">暂无保存资料</span>'; return; }
    persons.forEach((p,i)=>{
        const d=document.createElement('div'); d.className='person-item'; d.dataset.pid=p.id;
        d.title='点击加载此人信息'; d.innerHTML='<span class="pname">'+p.name+'</span><span class="pinfo">'+(p.gender==='male'?'♂':'♀')+' '+p.birthDate+'</span><button class="pedit" title="修改">✎</button><button class="pdel" title="删除">✕</button>';
        d.addEventListener('click',e=>{if(e.target.classList.contains('pedit'))return openEditModal(p,i);if(e.target.classList.contains('pdel'))return deletePerson(i);loadToForm(p);});
        c.appendChild(d);
    });
}
function deletePerson(i){ const p=loadPersons(); const n=p[i].name; if(!confirm('确定删除"'+n+'"的记录吗？')) return; p.splice(i,1); savePersons(p); renderPersonList(); showToast('已删除"'+n+'"'); }
function openEditModal(p,i){
    const o=document.createElement('div'); o.className='modal-overlay';
    o.innerHTML='<div class="modal-box" onclick="event.stopPropagation()"><h3>修改 "'+p.name+'" 的信息</h3><div class="form-row"><div class="form-group"><label>姓名</label><input id="editName" value="'+p.name.replace(/"/g,'&quot;')+'"></div><div class="form-group"><label>性别</label><select id="editGender"><option value="male"'+(p.gender==='male'?' selected':'')+'>男</option><option value="female"'+(p.gender==='female'?' selected':'')+'>女</option></select></div></div><div class="form-row" style="margin-top:8px"><div class="form-group"><label>出生日期</label><input type="date" id="editDate" value="'+p.birthDate+'"></div><div class="form-group"><label>小时</label><input type="number" id="editHour" min="0" max="23" value="'+p.hour+'" style="width:60px"></div><div class="form-group"><label>分钟</label><input type="number" id="editMinute" min="0" max="59" value="'+p.minute+'" style="width:60px"></div></div><div class="form-row" style="margin-top:8px"><div class="form-group"><label>出生经度</label><input type="number" id="editBLng" step="any" value="'+p.birthLng+'"></div><div class="form-group"><label>出生纬度</label><input type="number" id="editBLat" step="any" value="'+p.birthLat+'"></div></div><div class="form-row" style="margin-top:8px"><div class="form-group"><label>当下经度</label><input type="number" id="editCLng" step="any" value="'+(p.curLng||p.birthLng)+'"></div><div class="form-group"><label>当下纬度</label><input type="number" id="editCLat" step="any" value="'+(p.curLat||p.birthLat)+'"></div></div><div class="modal-actions"><button class="btn btn-sm" id="editCancel">取消</button><button class="btn btn-accent btn-sm" id="editSave">保存修改</button></div></div>';
    document.body.appendChild(o); o.addEventListener('click',()=>o.remove());
    o.querySelector('#editCancel').addEventListener('click',()=>o.remove());
    o.querySelector('#editSave').addEventListener('click',()=>{
        p.name=document.getElementById('editName').value.trim()||'未知'; p.gender=document.getElementById('editGender').value;
        p.birthDate=document.getElementById('editDate').value; p.hour=parseInt(document.getElementById('editHour').value)||0;
        p.minute=parseInt(document.getElementById('editMinute').value)||0; p.birthLng=parseFloat(document.getElementById('editBLng').value)||0;
        p.birthLat=parseFloat(document.getElementById('editBLat').value)||0; p.curLng=parseFloat(document.getElementById('editCLng').value)||0;
        p.curLat=parseFloat(document.getElementById('editCLat').value)||0; const ps=loadPersons(); ps[i]=p; savePersons(ps);
        o.remove(); renderPersonList(); showToast('"'+p.name+'" 已更新');
    });
}
document.getElementById('btnSavePerson').addEventListener('click',()=>{const d=getCurrentPersonData(),p=loadPersons();const idx=p.findIndex(x=>x.name===d.name&&x.birthDate===d.birthDate);if(idx>=0){if(!confirm('已存在"'+d.name+'"('+d.birthDate+')的记录，是否覆盖？'))return;p[idx]={...p[idx],...d,id:p[idx].id};}else p.push(d);savePersons(p);renderPersonList();showToast('保存成功');});
document.getElementById('btnExportJson').addEventListener('click',async()=>{const p=loadPersons();if(p.length===0)return showToast('没有可导出的数据');const j=JSON.stringify(p,null,2),fn='紫微斗数人物资料_'+new Date().toISOString().slice(0,10)+'.json',blob=new Blob([j],{type:'application/json'});if(navigator.share&&navigator.canShare){try{await navigator.share({files:[new File([blob],fn,{type:'application/json'})],title:'导出人物资料'});showToast('已分享 '+p.length+' 条记录');return;}catch(e){}}const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=fn;a.click();setTimeout(()=>URL.revokeObjectURL(url),3000);showToast('已导出 '+p.length+' 条记录');});
document.getElementById('btnImportJson').addEventListener('click',()=>{document.getElementById('importFileInput').click();});
document.getElementById('importFileInput').addEventListener('change',e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=ev=>{try{const imp=JSON.parse(ev.target.result);if(!Array.isArray(imp))throw new Error('格式不正确');const p=loadPersons();let m=0;imp.forEach(x=>{const idx=p.findIndex(y=>y.id===x.id);if(idx>=0){p[idx]=x;}else{p.push(x);m++;}});savePersons(p);renderPersonList();showToast('导入完成：'+imp.length+' 条记录（新增 '+m+' 条）');}catch(err){showToast('导入失败：文件格式不正确');}};r.readAsText(f);e.target.value='';});
document.getElementById('btnClearData').addEventListener('click',()=>{const p=loadPersons();if(p.length===0)return showToast('没有需要清空的数据');if(!confirm('确定清空全部 '+p.length+' 条人物资料吗？此操作不可恢复。\n建议先导出备份。'))return;localStorage.removeItem(STORAGE_KEY);renderPersonList();showToast('已清空全部本地人物数据');});

// ==================== postMessage 监听器 ====================
let childWindow = null;
window.addEventListener('message', (e) => {
    if(e.data && e.data.type === 'refreshEvPan'){
        const d = e.data.data;
        const pan = generatePan(d.y, d.m||1, d.d||1, d.h>=0?d.h:0, 0, d.gender, d.curLng);
        const evDesc = d.y+'年'+(d.m>0?d.m+'月':'')+(d.d>0?d.d+'日':'')+(d.h>=0?d.h+'时':'');
        const fuzzy = !d.m||!d.d||d.h<0;
        let evPanHTML = '<h2 style="text-align:center;color:#c9a063;font-size:1rem;margin-bottom:12px">📅 '+evDesc+' 当下真太阳时盘</h2>';
        evPanHTML += generatePanAnalysis('评估时间盘', pan, fuzzy?'部分时间未选，按模糊处理':'');
        const liuNianHTML = '<h4>📅 流年精断（'+d.y+'年）</h4>'+generateLiuNianAnalysis(e.data.birthPan, d.y);
        if(childWindow && !childWindow.closed){
            childWindow.postMessage({ type: 'chartUpdate', evPan: evPanHTML, liuNian: liuNianHTML, evYear: d.y }, '*');
        }
    }
});

// ==================== buildResultPage ====================
function buildResultPage(name, birthPan, evTime, evPan, curLngVal, gender, currentAge){
    const birthYear = evTime.year - currentAge;
    const evDesc = evTime.year+'年'+(evTime.month>0?evTime.month+'月':'')+(evTime.day>0?evTime.day+'日':'')+(evTime.hour>=0?evTime.hour+'时':'');
    const evFuzzy = !evTime.month||!evTime.day||evTime.hour<0;
    const curYr = new Date().getFullYear();
    let yOpts = ''; for(let y=1900; y<=2099; y++) yOpts += '<option value="'+y+'">'+y+'年</option>';
    let mOpts = '<option value="0">--</option>'; for(let m=1; m<=12; m++) mOpts += '<option value="'+m+'">'+m+'月</option>';
    let hOpts = '<option value="-1">--</option>'; for(let h=0; h<24; h++) hOpts += '<option value="'+h+'">'+h+'时</option>';
    const initD = evTime.day>0?evTime.day:0;
    const initEv = JSON.stringify({y:evTime.year,m:evTime.month,d:initD,h:evTime.hour});
    const birthData = JSON.stringify({stars:birthPan.stars,fuStars:birthPan.fuStars,siHua:birthPan.siHua,palaces:birthPan.palaces});

    const html = '<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>'+name+' 紫微斗数命盘</title><style>'+(document.getElementById('resultStyles')||document.querySelector('style:nth-of-type(2)')).textContent+'</style></head><body class="r-body"><div class="r-header"><h1>☯ '+name+' 紫微斗数命盘</h1><button class="r-btn" onclick="window.close()">← 返回主页面</button></div><div id="birthPanSection">'+generatePanAnalysis('出生命盘', birthPan)+'</div><div class="r-hr"></div><div class="r-ctl"><label>📅 运势评估时间:</label><select id="evY">'+yOpts+'</select><span style="color:#9a9da8;font-size:.7rem">年</span><select id="evM">'+mOpts+'</select><span style="color:#9a9da8;font-size:.7rem">月</span><select id="evD"><option value="0">--</option></select><span style="color:#9a9da8;font-size:.7rem">日</span><select id="evH">'+hOpts+'</select><span style="color:#9a9da8;font-size:.7rem">时</span><button class="r-ctl btn-go" onclick="refreshEvPan()">🔄 更新运势</button></div><div id="evPanSection"><h2 style="text-align:center;color:#c9a063;font-size:1rem;margin-bottom:12px">📅 '+evDesc+' 当下真太阳时盘</h2>'+generatePanAnalysis('评估时间盘', evPan, evFuzzy?'部分时间未选，按模糊处理':'')+'</div><div class="r-hr"></div><h2 style="text-align:center;color:#c9a063;font-size:1rem;margin-bottom:8px">🔮 大限与流年精断</h2><p class="r-note">基于出生命盘推演</p><div class="r-box" id="daxianSection"><h4>📆 大限精断</h4>'+generateDaXianAnalysis(birthPan, currentAge, birthYear)+'</div><div class="r-box" id="liunianSection"><h4>📅 流年精断（'+evTime.year+'年）</h4>'+generateLiuNianAnalysis(birthPan, evTime.year)+'</div><div class="r-footer"><button class="r-btn" onclick="window.close()">← 返回主页面</button><button class="r-btn" onclick="window.print()">🖨 打印命盘</button></div><script>'
+'(()=>{'
+'const PAGE={curLng:'+curLngVal+',gender:"'+gender+'",initEv:'+initEv+',birthData:'+birthData+'};'
+'function updateDayOpts(){let y=parseInt(document.getElementById("evY").value)||new Date().getFullYear();let m=parseInt(document.getElementById("evM").value)||1;let days=new Date(y,m,0).getDate();let evD=document.getElementById("evD");let cv=evD.value;let o="<option value=\\"0\\">--</option>";for(let d=1;d<=days;d++)o+="<option value=\\""+d+"\\">"+d+"日</option>";evD.innerHTML=o;evD.value=(cv&&parseInt(cv)<=days)?cv:"0";if(PAGE.initEv.d>0&&PAGE.initEv.d<=days)evD.value=PAGE.initEv.d;}'
+'function initControls(){let evY=document.getElementById("evY"),evM=document.getElementById("evM"),evH=document.getElementById("evH");evY.value=PAGE.initEv.y||new Date().getFullYear();evM.value=PAGE.initEv.m&&PAGE.initEv.m>0?PAGE.initEv.m:"0";evH.value=PAGE.initEv.h>=0?PAGE.initEv.h:"-1";updateDayOpts();evY.addEventListener("change",updateDayOpts);evM.addEventListener("change",updateDayOpts);}'
+'window.refreshEvPan=function(){let evY=parseInt(document.getElementById("evY").value);let evM=parseInt(document.getElementById("evM").value)||0;let evD=parseInt(document.getElementById("evD").value)||0;let evH=parseInt(document.getElementById("evH").value);if(isNaN(evH))evH=-1;if(!evY)return alert("请选择评估年份");window.opener.postMessage({type:"refreshEvPan",data:{y:evY,m:evM,d:evD,h:evH,gender:PAGE.gender,curLng:PAGE.curLng},birthPan:{stars:PAGE.birthData.stars,fuStars:PAGE.birthData.fuStars,siHua:PAGE.birthData.siHua,palaces:PAGE.birthData.palaces}},"*");};'
+'window.addEventListener("message",function(e){if(e.data&&e.data.type==="chartUpdate"){document.getElementById("evPanSection").innerHTML=e.data.evPan;document.getElementById("liunianSection").innerHTML=e.data.liuNian;}});'
+'initControls();'
+'var yd=new Date().getFullYear()-parseInt(document.getElementById("evY").value);'
+'})();'
+'<'+'/script></body></html>';

    return html;
}

// ==================== performAnalysis ====================
function performAnalysis(){
    try{
        const name = document.getElementById('nameInput').value.trim()||'未知';
        const birthDate = document.getElementById('birthDate').value;
        const h = parseInt(hourSel.value), min = parseInt(minuteSel.value);
        const g = document.getElementById('genderSelect').value;
        if(!birthDate || isNaN(birthLat)||isNaN(birthLng)) throw new Error('出生日期与出生地点必须完整填写');
        const [by,bm,bd] = birthDate.split('-').map(Number);
        const birthPan = generatePan(by,bm,bd,h,min,g,birthLng);
        const evY = parseInt(evYearSel.value); if(!evY) throw new Error('评估年份必须选择');
        const evM = evMonthSel.value?parseInt(evMonthSel.value):0, evD = evDaySel.value?parseInt(evDaySel.value):0, evH = evHourSel.value!==''?parseInt(evHourSel.value):-1;
        if(isNaN(curLat)||isNaN(curLng)) throw new Error('当下地点必须填写');
        const evPan = generatePan(evY, evM||1, evD||1, evH>=0?evH:0, 0, g, curLng);
        const currentAge = evY - by;
        const resultHTML = buildResultPage(name, birthPan, {year:evY,month:evM,day:evD,hour:evH}, evPan, curLng, g, currentAge);
        try {
            const win = window.open('about:blank', '_blank');
            if(!win || win.closed) throw 'blocked';
            childWindow = win; win.document.write(resultHTML); win.document.close();
        } catch(_) {
            const blob = new Blob([resultHTML], {type:'text/html;charset=utf-8'});
            const url = URL.createObjectURL(blob);
            childWindow = window.open(url, '_blank');
            if(!childWindow) throw new Error('弹窗被浏览器拦截');
            setTimeout(() => URL.revokeObjectURL(url), 30000);
        }
        document.getElementById('resultPanel').innerHTML = '<div style="text-align:center;color:var(--accent);padding:20px">✅ 排盘结果已在新窗口打开</div>';
        showToast('排盘完成');
    }catch(e){
        document.getElementById('resultPanel').innerHTML = '<div style="color:#f85149;padding:20px;text-align:center">⚠️ 排盘异常：'+e.message+'</div>';
        showToast('排盘失败: '+e.message);
    }
}
document.getElementById('btnAnalyze').addEventListener('click', performAnalysis);

// ==================== Toast ====================
function showToast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.className='toast show'; clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove('show'),2400); }
